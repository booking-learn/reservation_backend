name: Java CI with Maven

on:
  push:
    branches: 
      - master
      - develop
  pull_request:
    branches: 
      - master
      - develop

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v7
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Set up spotless
        run: mvn spotless:check -q


  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Java 25
      uses: actions/setup-java@v7
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
  
  compile:
    name: Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v7
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compilation
        run: mvn compile -q 
    
  test:
    name: Compilation
    runs-on: ubuntu-latest
    steps:
      -  name : checkout
         uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v7
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: run all tests
        run: mvn test -q

    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
