spring:
  datasource:
    url: jdbc:mysql://${TIDB_HOST}:4000/${TIDB_DB}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: ${TIDB_USERNAME}
    password: ${TIDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  swagger-ui:
    server-url: https://vet-clinic-backend-eji8.onrender.com
  show-actuator: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized


logging:
  level:
    root: INFO
    org.hibernate: DEBUG
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG